<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rápido">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data: https://cdn.jsdelivr.net; connect-src https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'none'; form-action 'none';">
<title>Ejercicio rápido · 10 min</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#0d0d0f; --surface:#18181c; --surface2:#222228;
  --border:rgba(255,255,255,0.08); --text:#f0efe8; --muted:#777;
  --accent:#EF9F27; --accent-text:#000; --rest:#5DCAA5;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
html, body { height:100%; background:var(--bg); overscroll-behavior:none; }
body { color:var(--text); font-family:'Syne',sans-serif; padding-top:var(--safe-top);
  -webkit-user-select:none; user-select:none; touch-action:manipulation; }

.topbar { display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px 9px 18px; border-bottom:1px solid var(--border); }
.topbar-title { font-size:13px; font-weight:800; letter-spacing:.03em; }
.gear-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text);
  width:34px; height:34px; border-radius:10px; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; text-decoration:none;
  -webkit-tap-highlight-color:transparent; }

.screen { display:none; padding:24px calc(20px + env(safe-area-inset-right,0px)) calc(24px + var(--safe-bot));
  max-width:480px; margin:0 auto; text-align:center; }
.screen.show { display:block; }

.intro-icon { font-size:48px; }
.intro-title { font-size:22px; font-weight:800; margin-top:12px; }
.intro-sub { font-size:13px; color:var(--muted); margin-top:8px; line-height:1.6; }
.intro-btn { margin-top:26px; background:var(--accent); color:var(--accent-text); border:none;
  border-radius:16px; padding:16px 40px; font-weight:800; font-size:16px; font-family:'Syne',sans-serif;
  cursor:pointer; -webkit-tap-highlight-color:transparent; }
.intro-note { font-size:11px; color:var(--muted); margin-top:14px; }

.phase-label { display:inline-block; font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;
  padding:5px 16px; border-radius:20px; margin-bottom:10px; }
.phase-label.work { background:rgba(239,159,39,.16); color:var(--accent); }
.phase-label.rest { background:rgba(93,202,165,.16); color:var(--rest); }
.play-progress { font-size:11px; color:var(--muted); margin-bottom:16px; font-family:'Space Mono',monospace; }
.play-timer { font-family:'Space Mono',monospace; font-size:64px; font-weight:700; line-height:1; }
.play-timer.work { color:var(--accent); }
.play-timer.rest { color:var(--rest); }
.play-gif { width:100%; max-width:260px; aspect-ratio:1/1; object-fit:contain; display:block; margin:18px auto 0; border-radius:16px; background:var(--surface2); }
.play-name { font-size:19px; font-weight:800; margin-top:14px; }
.play-hint { font-size:11px; color:var(--muted); margin-top:4px; }
.play-next { font-size:13px; color:var(--muted); margin-top:16px; }
.play-controls { display:flex; gap:10px; margin-top:22px; }
.p-btn { flex:1; border:none; border-radius:14px; padding:13px; font-family:'Syne',sans-serif;
  font-size:13px; font-weight:700; cursor:pointer; background:var(--surface2); color:var(--text);
  border:1px solid var(--border); -webkit-tap-highlight-color:transparent; }

.complete-icon { font-size:60px; }
.complete-title { font-size:24px; font-weight:800; margin-top:10px; }
.complete-sub { color:var(--muted); margin-top:8px; font-size:13px; }
.complete-actions { display:flex; flex-direction:column; gap:10px; margin-top:26px; }
.complete-btn { background:var(--accent); color:var(--accent-text); border:none;
  border-radius:14px; padding:14px; font-weight:700; font-family:'Syne',sans-serif; cursor:pointer;
  -webkit-tap-highlight-color:transparent; }
.complete-btn.secondary { background:var(--surface2); color:var(--text); border:1px solid var(--border); }
</style>
</head>
<body>

<div class="topbar">
  <a class="gear-btn" href="index.html" title="Volver al inicio">←</a>
  <span class="topbar-title">⚡ Ejercicio rápido</span>
  <span style="width:34px"></span>
</div>

<div class="screen show" id="intro-screen">
  <div class="intro-icon">⚡</div>
  <div class="intro-title">10 minutos, 8 ejercicios</div>
  <div class="intro-sub">Ejercicios al azar de todo el catálogo, sin repetir. 45s de trabajo + 30s de descanso cada uno — cronometrado, no tienes que contar reps, solo sigue el ritmo.</div>
  <button class="intro-btn" onclick="startSession()" id="intro-btn">Empezar</button>
  <div class="intro-note" id="intro-note"></div>
</div>

<div class="screen" id="play-screen">
  <div class="phase-label" id="phase-label">Trabajo</div>
  <div class="play-progress" id="play-progress"></div>
  <div class="play-timer" id="play-timer">45</div>
  <img class="play-gif" id="play-gif" alt="">
  <div class="play-name" id="play-name"></div>
  <div class="play-hint" id="play-hint"></div>
  <div class="play-next" id="play-next"></div>
  <div class="play-controls">
    <button class="p-btn" id="btn-pause" onclick="togglePause()">⏸ Pausar</button>
    <button class="p-btn" onclick="goHome()">✕ Salir</button>
  </div>
</div>

<div class="screen" id="complete-screen">
  <div class="complete-icon">🔥</div>
  <div class="complete-title">¡10 minutos completos!</div>
  <div class="complete-sub" id="complete-sub">8 ejercicios hechos. Buen trabajo.</div>
  <div class="complete-actions">
    <button class="complete-btn" onclick="startSession()">Otra ronda</button>
    <button class="complete-btn secondary" onclick="goHome()">Volver al inicio</button>
  </div>
</div>

<script>
/* =====================================================================
   EJERCICIO RÁPIDO — 10 min cronometrados, 8 ejercicios al azar
   45s trabajo + 30s descanso × 8 = 600s exactos, mismo catálogo/CDN
   que entrenamientos.html, mismo patrón de beep/vibración que index.
   ===================================================================== */

const EX_URL = 'https://cdn.jsdelivr.net/gh/JahelCuadrado/ExerciseGymGifsDB@v1.1.0/api/es/equipment/bodyweight.json';
const COUNT = 8, WORK_SECONDS = 45, REST_SECONDS = 30;

/* Filtra ejercicios que piden equipo poco común en casa (pelotas/fitball/bosu, barras/barras
   paralelas). Los de banco se dejan pero se marcan para sugerir una silla en su lugar. */
const NO_EQUIPMENT_RE = /ball|balon|balón|pelota|medicine|swiss|estabilidad|barbell|ez-bar|\bbars?\b|barra/i;
const CHAIR_TIP_RE = /bench|banco/i;

let poolStatus = 'idle', poolPromise = null, ALL_EXERCISES = [];
let session = [], idx = 0, phase = 'work';
let phaseEndAt = 0, phaseWarned = false, timerId = null;
let paused = false, pausedAt = 0;

/* ---------- datos ---------- */
async function ensurePool(){
  if(poolStatus==='ready') return true;
  if(poolPromise) return poolPromise;
  poolStatus = 'loading';
  poolPromise = (async()=>{
    try{
      const res = await fetch(EX_URL);
      if(!res.ok) throw new Error('HTTP '+res.status);
      const data = await res.json();
      if(!Array.isArray(data.exercises) || !data.exercises.length) throw new Error('pool vacío');
      ALL_EXERCISES = data.exercises.filter(e=>{
        const text = e.slug+' '+e.name;
        if(NO_EQUIPMENT_RE.test(text)) return false;
        e.chairTip = CHAIR_TIP_RE.test(text);
        return true;
      });
      if(!ALL_EXERCISES.length) throw new Error('pool vacío tras filtrar');
      poolStatus = 'ready';
      return true;
    }catch(e){
      poolStatus = 'error';
      return false;
    }finally{
      poolPromise = null;
    }
  })();
  return poolPromise;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

/* ---------- audio/vibración (mismo patrón que index.html/entrenamientos.html) ---------- */
let actx=null;
function initAudio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx && actx.state==='suspended') actx.resume();
}
function beep(freq,dur,vol){
  if(!actx) return;
  try{
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.25, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function vibrate(p){ if(navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }
document.body.addEventListener('touchstart', initAudio, {once:true});
document.body.addEventListener('click', initAudio, {once:true});

/* ---------- pantallas ---------- */
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('show'));
  document.getElementById(name+'-screen').classList.add('show');
}
function goHome(){ stopTimer(); releaseWakeLock(); location.href = 'index.html'; }

/* ---------- sesión ---------- */
async function startSession(){
  initAudio();
  if(poolStatus!=='ready'){
    document.getElementById('intro-btn').disabled = true;
    document.getElementById('intro-note').textContent = 'Cargando ejercicios…';
    const ok = await ensurePool();
    document.getElementById('intro-btn').disabled = false;
    if(!ok){
      document.getElementById('intro-note').textContent = 'No se pudo cargar (revisa tu internet).';
      return;
    }
    document.getElementById('intro-note').textContent = '';
  }
  session = shuffle(ALL_EXERCISES).slice(0, COUNT);
  idx = 0;
  phase = 'work';
  showScreen('play');
  requestWakeLock();
  startPhase();
}

function stopTimer(){
  clearInterval(timerId);
  timerId = null;
  paused = false;
  pausedAt = 0;
  const btn = document.getElementById('btn-pause');
  if(btn) btn.textContent = '⏸ Pausar';
}

/* ---------- pantalla encendida mientras corre la sesión ---------- */
let wakeLock = null;
async function requestWakeLock(){
  if('wakeLock' in navigator) try{ wakeLock = await navigator.wakeLock.request('screen'); }catch(e){}
}
async function releaseWakeLock(){
  if(wakeLock){ try{ await wakeLock.release(); }catch(e){} wakeLock = null; }
}
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && timerId) requestWakeLock();
});

function startPhase(){
  stopTimer();
  phaseWarned = false;
  const dur = phase==='work' ? WORK_SECONDS : REST_SECONDS;
  phaseEndAt = Date.now() + dur*1000;
  render();
  timerId = setInterval(tick, 250);
}

function tick(){
  if(paused) return;
  const left = Math.max(0, Math.ceil((phaseEndAt-Date.now())/1000));
  if(phase==='rest' && !phaseWarned && left<=10 && left>0){
    phaseWarned = true; vibrate([90,70,90]); beep(1320,0.1,0.28);
  }
  if(left<=0){
    advancePhase();
    return;
  }
  updateTimer(left);
}

function advancePhase(){
  if(phase==='work'){
    vibrate(150); beep(880,0.15,0.25);
    phase = 'rest';
    startPhase();
  } else {
    if(idx >= session.length-1){ finishSession(); return; }
    idx++;
    phase = 'work';
    vibrate([100,60,100]); beep(660,0.12,0.25);
    startPhase();
  }
}

function togglePause(){
  paused = !paused;
  if(paused){ pausedAt = Date.now(); }
  else if(pausedAt){ phaseEndAt += (Date.now()-pausedAt); pausedAt = 0; }
  document.getElementById('btn-pause').textContent = paused ? '▶ Continuar' : '⏸ Pausar';
}

function finishSession(){
  stopTimer();
  releaseWakeLock();
  vibrate([300,100,300,100,600]);
  beep(523,0.15,0.3); setTimeout(()=>beep(659,0.15,0.3),160); setTimeout(()=>beep(784,0.35,0.3),330);
  document.getElementById('complete-sub').textContent = `${session.length} ejercicios hechos. Buen trabajo.`;
  showScreen('complete');
}

/* ---------- render ---------- */
function render(){
  const ex = session[idx];
  if(!ex){
    document.getElementById('play-name').textContent = 'Sin ejercicios disponibles.';
    document.getElementById('play-hint').textContent = '';
    document.getElementById('play-gif').style.display = 'none';
    return;
  }
  const label = document.getElementById('phase-label');
  const timer = document.getElementById('play-timer');
  label.textContent = phase==='work' ? 'Trabajo' : 'Descanso';
  label.className = 'phase-label ' + phase;
  timer.className = 'play-timer ' + phase;
  document.getElementById('play-progress').textContent = `Ejercicio ${idx+1}/${session.length}`;

  const img = document.getElementById('play-gif');
  if(phase==='work'){
    img.removeAttribute('src');
    img.src = ex.gifUrl; img.alt = ex.name; img.style.visibility = '';
    document.getElementById('play-name').textContent = ex.name;
    document.getElementById('play-hint').textContent = ex.chairTip
      ? 'Haz las repeticiones que puedas · 💡 ¿No tienes banco? Usa una silla.'
      : 'Haz las repeticiones que puedas';
    document.getElementById('play-next').textContent = '';
  } else {
    img.style.visibility = 'hidden';
    document.getElementById('play-name').textContent = 'Descanso';
    document.getElementById('play-hint').textContent = '';
    const next = session[idx+1];
    document.getElementById('play-next').textContent = next ? `Siguiente: ${next.name}` : 'Último — ya casi terminas';
  }
  updateTimer(phase==='work' ? WORK_SECONDS : REST_SECONDS);
}

function updateTimer(left){
  document.getElementById('play-timer').textContent = left;
}

/* ---------- init ---------- */
ensurePool();
</script>
</body>
</html>

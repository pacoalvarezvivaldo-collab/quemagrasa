<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Estadísticas">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';">
<title>Estadísticas · SPORTIUUM</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#0d0d0f; --surface:#18181c; --surface2:#222228;
  --border:rgba(255,255,255,0.08); --text:#f0efe8; --muted:#777;
  --accent:#EF9F27; --accent-text:#000;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
html, body { height:100%; background:var(--bg); overscroll-behavior:none; }
body { color:var(--text); font-family:'Syne',sans-serif; padding-top:var(--safe-top);
  -webkit-user-select:none; user-select:none; touch-action:manipulation; }

.topbar { display:flex; align-items:center; justify-content:space-between;
  padding:12px 14px 9px 18px; border-bottom:1px solid var(--border); }
.topbar-title { font-size:13px; font-weight:800; letter-spacing:.03em; }
.gear-btn { background:var(--surface2); border:1px solid var(--border); color:var(--text);
  width:34px; height:34px; border-radius:10px; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; text-decoration:none;
  -webkit-tap-highlight-color:transparent; }

.wrap { max-width:480px; margin:0 auto; padding:20px calc(20px + env(safe-area-inset-right,0px)) calc(24px + var(--safe-bot)); }

.stat-card { background:var(--surface); border:1.5px solid var(--border); border-radius:14px;
  padding:16px; margin-bottom:10px; }
.stat-card-title { font-weight:800; font-size:14px; display:flex; align-items:center; gap:8px; margin-bottom:10px; }
.stat-row { display:flex; justify-content:space-between; align-items:baseline; padding:4px 0; font-size:13px; }
.stat-row .stat-label { color:var(--muted); }
.stat-row .stat-value { font-family:'Space Mono',monospace; font-weight:700; }
.stat-line { color:var(--muted); font-size:13px; padding:4px 0; }
.stat-empty { color:var(--muted); font-size:12.5px; }

/* ---- Tu progreso: peso, estatura, meta, IMC (antes vivía en Inicio) ---- */
.field-label { font-size:12.5px; font-weight:700; display:block; margin-bottom:6px; }
.field-input { background:var(--surface2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:9px 10px; font-family:'Space Mono',monospace; font-size:14px;
  width:100%; -webkit-appearance:none; margin-bottom:12px; }
.progress-btn { width:100%; background:var(--accent); color:var(--accent-text); border:none;
  border-radius:12px; padding:12px; font-weight:700; font-family:'Syne',sans-serif; font-size:13px;
  cursor:pointer; -webkit-tap-highlight-color:transparent; }
.progress-btn-secondary { width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border);
  border-radius:12px; padding:12px; font-weight:700; font-family:'Syne',sans-serif; font-size:13px;
  cursor:pointer; -webkit-tap-highlight-color:transparent; margin-top:8px; }

.progress-today-row { display:flex; gap:8px; align-items:flex-start; }
.progress-today-row .field-input { margin-bottom:12px; }
.progress-today-row .progress-btn { width:auto; padding:9px 16px; white-space:nowrap; }

.progress-goal-link { font-size:12px; color:var(--muted); margin-bottom:12px; cursor:pointer;
  -webkit-tap-highlight-color:transparent; }
.progress-goal-form { background:var(--surface2); border:1px solid var(--border); border-radius:12px;
  padding:12px; margin-bottom:14px; }

.progress-summary { font-size:13px; line-height:1.6; margin-bottom:14px; }
.progress-summary .status-line { color:var(--muted); font-size:12px; margin-top:2px; }

.progress-chart-wrap { margin-bottom:14px; }
.progress-chart-wrap svg { width:100%; height:auto; display:block; }

.progress-bmi { display:none; align-items:center; gap:8px; font-family:'Space Mono',monospace;
  font-size:13px; background:var(--surface2); border-radius:10px; padding:9px 12px; }
.progress-bmi .bmi-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
</style>
</head>
<body>

<div class="topbar">
  <span style="width:34px"></span>
  <span class="topbar-title">📈 Estadísticas</span>
  <span style="width:34px"></span>
</div>

<div class="wrap">
  <div class="stat-card">
    <div class="stat-card-title">📊 Tu progreso</div>
    <div id="progress-first-form">
      <label class="field-label">Peso (kg)</label>
      <input class="field-input" id="progress-first-weight" type="number" inputmode="decimal" min="30" max="300" step="0.1" placeholder="70.0">
      <label class="field-label">Estatura (cm)</label>
      <input class="field-input" id="progress-first-height" type="number" inputmode="numeric" min="100" max="250" placeholder="170">
      <button class="progress-btn" onclick="saveFirstEntry()">Guardar</button>
    </div>
    <div id="progress-data" style="display:none;">
      <div class="stat-line" id="progress-sub"></div>
      <div class="progress-today-row">
        <input class="field-input" id="progress-today-weight" type="number" inputmode="decimal" min="30" max="300" step="0.1">
        <button class="progress-btn" onclick="saveTodayEntry()">Guardar</button>
      </div>
      <div class="progress-goal-link" id="progress-height-link" onclick="toggleHeightForm()"></div>
      <div class="progress-goal-form" id="progress-height-form" style="display:none;">
        <label class="field-label">Estatura (cm)</label>
        <input class="field-input" id="progress-height-input" type="number" inputmode="numeric" min="100" max="250">
        <button class="progress-btn" onclick="saveHeightEntry()">Guardar</button>
      </div>
      <div class="progress-goal-link" id="progress-goal-link" onclick="toggleGoalForm()"></div>
      <div class="progress-goal-form" id="progress-goal-form" style="display:none;">
        <label class="field-label">Peso meta (kg)</label>
        <input class="field-input" id="progress-goal-weight" type="number" inputmode="decimal" min="30" max="300" step="0.1">
        <label class="field-label">Fecha meta</label>
        <input class="field-input" id="progress-goal-date" type="date">
        <button class="progress-btn" onclick="saveGoalEntry()">Guardar meta</button>
        <button class="progress-btn-secondary" id="progress-goal-remove" onclick="removeGoalEntry()" style="display:none;">Quitar meta</button>
      </div>
      <div class="progress-summary" id="progress-summary"></div>
      <div class="progress-chart-wrap" id="progress-chart-wrap"></div>
      <div class="progress-bmi" id="progress-bmi"></div>
    </div>
  </div>

  <div class="stat-card">
    <div class="stat-card-title">📊 Resumen general</div>
    <div class="stat-line" id="stat-total-days"></div>
    <div class="stat-line" id="stat-current-streak"></div>
  </div>

  <div class="stat-card">
    <div class="stat-card-title">🏃‍♂️ Correr / Caminar</div>
    <div class="stat-row"><span class="stat-label">Sesiones</span><span class="stat-value" id="correr-sesiones"></span></div>
    <div class="stat-row"><span class="stat-label">Distancia total</span><span class="stat-value" id="correr-km"></span></div>
    <div class="stat-row"><span class="stat-label">Kcal quemadas</span><span class="stat-value" id="correr-kcal"></span></div>
  </div>

  <div class="stat-card">
    <div class="stat-card-title">🌀 Cardio (Elíptica · Caminadora · Escaladora)</div>
    <div class="stat-row"><span class="stat-label">Sesiones</span><span class="stat-value" id="cardio-sesiones"></span></div>
    <div class="stat-row"><span class="stat-label">Kcal quemadas</span><span class="stat-value" id="cardio-kcal"></span></div>
    <div class="stat-row"><span class="stat-label">Sprints totales</span><span class="stat-value" id="cardio-sprints"></span></div>
  </div>

  <div class="stat-card">
    <div class="stat-card-title">🏠 Casa</div>
    <div class="stat-row"><span class="stat-label">Nivel</span><span class="stat-value" id="casa-level"></span></div>
    <div class="stat-line" id="casa-days"></div>
  </div>

  <div class="stat-card">
    <div class="stat-card-title">🏢 Gimnasio</div>
    <div class="stat-row"><span class="stat-label">Nivel</span><span class="stat-value" id="gimnasio-level"></span></div>
    <div class="stat-line" id="gimnasio-days"></div>
  </div>

  <div class="stat-card">
    <div class="stat-card-title">⚡ Ejercicio rápido</div>
    <div class="stat-empty">Sin datos guardados aún</div>
  </div>
</div>

<script src="sync.js"></script>
<script src="weight-log.js"></script>
<script src="streak.js"></script>
<script src="prefs.js"></script>
<script src="nav.js"></script>
<script>
/* =====================================================================
   estadisticas.html — vista de solo lectura: junta totales de los 5
   modos de entrenamiento leyendo directo de las llaves de localStorage
   que cada uno ya escribe. No engancha nada nuevo, no escribe nada.
   Ver docs/superpowers/specs/2026-08-22-estadisticas-design.md
   ===================================================================== */

/* ---------- lógica pura (testeable sin red/DOM) ---------- */
function uniqueDayCount(activityLog){
  return new Set(activityLog).size;
}

function sumCorrer(history){
  return history.reduce((acc, e) => {
    acc.sesiones++;
    acc.km += (e.distanceM || 0) / 1000;
    acc.kcal += (e.kcal || 0);
    return acc;
  }, { sesiones: 0, km: 0, kcal: 0 });
}

function sumCardio(sessions){
  return sessions.reduce((acc, s) => {
    acc.sesiones++;
    acc.kcal += (s.kcal || 0);
    acc.sprints += (s.spr || 0);
    return acc;
  }, { sesiones: 0, kcal: 0, sprints: 0 });
}
/* ---------- fin lógica pura ---------- */

const LEVEL_LABELS = {
  facil:     { label:'Fácil',     icon:'🌱' },
  medio:     { label:'Medio',     icon:'🔥' },
  dificil:   { label:'Difícil',   icon:'💥' },
  espartano: { label:'Espartano', icon:'⚔️' }
};

function readJSON(key){
  try{ return JSON.parse(localStorage.getItem(key)) || []; }catch(e){ return []; }
}

function renderSummary(){
  const log = readJSON('qg_activity_log');
  const days = uniqueDayCount(log);
  document.getElementById('stat-total-days').textContent = `${days} día${days===1?'':'s'} entrenados en total`;
  const streak = window.Streak ? Streak.getCurrentStreak() : 0;
  document.getElementById('stat-current-streak').textContent =
    streak > 0 ? `🔥 ${streak} día${streak===1?'':'s'} seguido${streak===1?'':'s'}` : 'Sin racha activa';
}

function renderCorrer(){
  const s = sumCorrer(readJSON('correr_history'));
  document.getElementById('correr-sesiones').textContent = s.sesiones;
  document.getElementById('correr-km').textContent = s.km.toFixed(1) + ' km';
  document.getElementById('correr-kcal').textContent = Math.round(s.kcal) + ' kcal';
}

function renderCardio(){
  const s = sumCardio(readJSON('qg_history'));
  document.getElementById('cardio-sesiones').textContent = s.sesiones;
  document.getElementById('cardio-kcal').textContent = Math.round(s.kcal) + ' kcal';
  document.getElementById('cardio-sprints').textContent = s.sprints;
}

function renderPlan(prefix, levelElId, daysElId){
  let level = null;
  try{ level = localStorage.getItem(prefix + 'level'); }catch(e){}
  const completed = readJSON(prefix + 'completed');
  const info = LEVEL_LABELS[level];
  document.getElementById(levelElId).textContent = info ? `${info.icon} ${info.label}` : 'Sin nivel elegido';
  document.getElementById(daysElId).textContent = `${completed.length}/30 días completados`;
}

/* ---------- Tu progreso: peso, estatura, meta, IMC (movido aquí desde Inicio —
   no tenía sentido en el hub de arranque, y aquí queda junto a las demás
   estadísticas). ---------- */
function saveFirstEntry(){
  const w = parseFloat(document.getElementById('progress-first-weight').value);
  const h = parseFloat(document.getElementById('progress-first-height').value);
  if(isNaN(w) || w<30 || w>300 || isNaN(h) || h<100 || h>250){
    alert('Ingresa un peso (30-300 kg) y estatura (100-250 cm) válidos.');
    return;
  }
  WeightLog.saveTodayWeight(w);
  WeightLog.saveHeightCm(h);
  if(window.QuemaSync){
    QuemaSync.pushWeightEntry({ date: WeightLog.todayStr(), weightKg: w });
    QuemaSync.pushUserState({ height_cm: h });
  }
  renderProgress();
}

function saveTodayEntry(){
  const w = parseFloat(document.getElementById('progress-today-weight').value);
  if(isNaN(w) || w<30 || w>300){
    alert('Ingresa un peso válido (30-300 kg).');
    return;
  }
  WeightLog.saveTodayWeight(w);
  if(window.QuemaSync) QuemaSync.pushWeightEntry({ date: WeightLog.todayStr(), weightKg: w });
  renderProgress();
}

function renderProgress(){
  const log = WeightLog.getLog();
  const sub = document.getElementById('progress-sub');
  const firstForm = document.getElementById('progress-first-form');
  const data = document.getElementById('progress-data');

  if(!log.length){
    firstForm.style.display = '';
    data.style.display = 'none';
    return;
  }

  firstForm.style.display = 'none';
  data.style.display = '';
  const last = log[log.length-1];
  sub.textContent = `Último registro: ${last.weightKg} kg`;
  document.getElementById('progress-today-weight').value = last.weightKg;

  renderWeightSummary(log);
  renderHeightLink();
  renderGoalLink();
  renderChart(log);
  renderBmi(last.weightKg);
}

function renderHeightLink(){
  const link = document.getElementById('progress-height-link');
  const h = WeightLog.getHeightCm();
  link.textContent = h ? `📏 ${h} cm · editar` : '📏 agregar estatura';
  if(h) document.getElementById('progress-height-input').value = h;
}

function toggleHeightForm(){
  const form = document.getElementById('progress-height-form');
  form.style.display = form.style.display === 'none' ? '' : 'none';
}

function saveHeightEntry(){
  const h = parseFloat(document.getElementById('progress-height-input').value);
  if(isNaN(h) || h<100 || h>250){
    alert('Ingresa una estatura válida (100-250 cm).');
    return;
  }
  WeightLog.saveHeightCm(h);
  if(window.QuemaSync) QuemaSync.pushUserState({ height_cm: h });
  document.getElementById('progress-height-form').style.display = 'none';
  renderProgress();
}

function renderBmi(weightKg){
  const el = document.getElementById('progress-bmi');
  const heightCm = WeightLog.getHeightCm();
  if(!heightCm){ el.style.display = 'none'; return; }
  const bmi = WeightLog.bmiValue(weightKg, heightCm);
  const band = WeightLog.bmiBand(bmi);
  el.style.display = 'flex';
  el.innerHTML = `<span class="bmi-dot" style="background:${band.color}"></span> IMC ${bmi} · ${band.label}`;
}

function renderChart(log){
  const wrap = document.getElementById('progress-chart-wrap');
  if(log.length < 2){ wrap.innerHTML = ''; return; }
  wrap.innerHTML = buildChartSvg(log, WeightLog.getGoal());
}

function buildChartSvg(log, goal){
  const W = 280, H = 140, PAD = 8;
  const today = WeightLog.todayStr();
  const firstDate = log[0].date;
  let lastDate = log[log.length-1].date;
  if(goal && goal.date > lastDate) lastDate = goal.date;
  if(today > lastDate) lastDate = today;

  const weights = log.map(e=>e.weightKg);
  if(goal) weights.push(goal.weightKg);
  const minW = Math.min(...weights), maxW = Math.max(...weights);
  const span = Math.max(0.5, maxW - minW);
  const yMin = minW - span*0.1, yMax = maxW + span*0.1;
  const totalDays = Math.max(1, WeightLog.daysBetween(firstDate, lastDate));

  const xScale = dateStr => PAD + (WeightLog.daysBetween(firstDate, dateStr)/totalDays) * (W - PAD*2);
  const yScale = w => H - PAD - ((w - yMin)/(yMax - yMin)) * (H - PAD*2);

  const realPts = log.map(e => `${xScale(e.date).toFixed(1)},${yScale(e.weightKg).toFixed(1)}`).join(' ');
  let svg = `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<polyline points="${realPts}" fill="none" stroke="var(--accent)" stroke-width="2"/>`;
  if(goal){
    const gx1 = xScale(firstDate).toFixed(1), gy1 = yScale(log[0].weightKg).toFixed(1);
    const gx2 = xScale(goal.date).toFixed(1), gy2 = yScale(goal.weightKg).toFixed(1);
    svg += `<line x1="${gx1}" y1="${gy1}" x2="${gx2}" y2="${gy2}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
  }
  svg += `<text x="${PAD}" y="10" font-size="8" fill="var(--muted)">${yMax.toFixed(1)} kg</text>`;
  svg += `<text x="${PAD}" y="${H-2}" font-size="8" fill="var(--muted)">${yMin.toFixed(1)} kg</text>`;
  svg += `</svg>`;
  return svg;
}

function renderGoalLink(){
  const link = document.getElementById('progress-goal-link');
  const goal = WeightLog.getGoal();
  const removeBtn = document.getElementById('progress-goal-remove');
  if(goal){
    link.textContent = `🎯 ${goal.weightKg}kg para ${fmtDate(goal.date)} · editar`;
    document.getElementById('progress-goal-weight').value = goal.weightKg;
    document.getElementById('progress-goal-date').value = goal.date;
    removeBtn.style.display = '';
  } else {
    link.textContent = '🎯 poner meta';
    removeBtn.style.display = 'none';
  }
}

function toggleGoalForm(){
  const form = document.getElementById('progress-goal-form');
  document.getElementById('progress-goal-date').min = WeightLog.todayStr();
  form.style.display = form.style.display === 'none' ? '' : 'none';
}

function saveGoalEntry(){
  const w = parseFloat(document.getElementById('progress-goal-weight').value);
  const d = document.getElementById('progress-goal-date').value;
  if(isNaN(w) || w<30 || w>300 || !d || d <= WeightLog.todayStr()){
    alert('Ingresa un peso meta (30-300 kg) y una fecha futura válidos.');
    return;
  }
  WeightLog.saveGoal(w, d);
  if(window.QuemaSync) QuemaSync.pushUserState({ goal_weight_kg: w, goal_date: d });
  document.getElementById('progress-goal-form').style.display = 'none';
  renderProgress();
}

function removeGoalEntry(){
  WeightLog.clearGoal();
  if(window.QuemaSync) QuemaSync.pushUserState({ goal_weight_kg: null, goal_date: null });
  document.getElementById('progress-goal-form').style.display = 'none';
  renderProgress();
}

function fmtDate(dateStr){
  const [y,m,d] = dateStr.split('-');
  return `${d}/${m}`;
}

function renderWeightSummary(log){
  const s = WeightLog.weightChangeSummary(log);
  const el = document.getElementById('progress-summary');
  if(!s){ el.innerHTML = ''; return; }
  const verb = s.deltaKg >= 0 ? 'bajado' : 'subido';
  const abs = Math.abs(s.deltaKg);
  let html = `Has ${verb} ${abs.toFixed(1)} kg desde el ${fmtDate(s.startDate)} `+
    `(inicio: ${s.startWeight} kg → hoy: ${s.currentWeight} kg)`;

  const goal = WeightLog.getGoal();
  if(goal){
    const status = WeightLog.progressStatus(WeightLog.todayStr(), s.startDate, s.startWeight, goal.date, goal.weightKg, s.currentWeight);
    let line;
    if(status.phase === 'done'){
      line = status.met ? 'Meta cumplida 🎉' : `No se alcanzó la meta — te quedaste a ${status.diffKg.toFixed(1)} kg`;
    } else if(status.phase === 'ontrack'){
      line = 'Vas a tiempo';
    } else if(status.phase === 'ahead'){
      line = `Vas ${status.diffKg.toFixed(1)} kg adelantado`;
    } else {
      line = `Vas ${status.diffKg.toFixed(1)} kg atrasado respecto al plan`;
    }
    html += `<div class="status-line">${line}</div>`;
  }
  el.innerHTML = html;
}

/* si ya hay sesión de sync activa (iniciada desde Casa o Correr), trae peso/estatura/
   meta del servidor y los fusiona con lo local — sin sesión, no hace ninguna llamada. */
async function syncPullOnLoad(){
  if(!window.QuemaSync) return;
  await QuemaSync.initSilent();
  if(!QuemaSync.isSignedIn()) return;

  const heightBefore = WeightLog.getHeightCm();
  const goalBefore = WeightLog.getGoal();
  const logBefore = WeightLog.getLog();

  const remote = await QuemaSync.pullUserState();
  if(remote){
    if(remote.heightCm != null && WeightLog.getHeightCm() === heightBefore) WeightLog.saveHeightCm(remote.heightCm);
    const goalNow = WeightLog.getGoal();
    const goalKey = g => g ? `${g.weightKg}|${g.date}` : null;
    if(goalKey(goalNow) === goalKey(goalBefore)){
      if(remote.goalWeightKg != null && remote.goalDate) WeightLog.saveGoal(remote.goalWeightKg, remote.goalDate);
      else WeightLog.clearGoal();
    }
    if(remote.activityLog && remote.activityLog.length) Streak.mergeRemoteLog(remote.activityLog);
  }
  const mergedWeightLog = await QuemaSync.pullAndMergeWeightLog(logBefore);
  if(JSON.stringify(WeightLog.getLog()) === JSON.stringify(logBefore)) WeightLog.mergeRemoteLog(mergedWeightLog);
  renderProgress();
  renderSummary();
}
if(window.QuemaSync) syncPullOnLoad().catch(()=>{});

try{ renderProgress(); }catch(e){}
renderSummary();
renderCorrer();
renderCardio();
renderPlan('ent_', 'casa-level', 'casa-days');
renderPlan('gym_', 'gimnasio-level', 'gimnasio-days');
try{ Prefs.applyThemeIfSet(); }catch(e){}
try{ Prefs.applyRainbowIfOn(); }catch(e){}
document.addEventListener('click', ()=>{ try{ Prefs.maybeRequestFullscreen(); }catch(e){} }, {once:true});
Nav.render('progreso');
</script>
</body>
</html>

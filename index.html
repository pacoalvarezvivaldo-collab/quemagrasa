<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Quemagrasa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' data:; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none';">
<title>Quemagrasa</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#0d0d0f; --surface:#18181c; --surface2:#222228;
  --border:rgba(255,255,255,0.08); --text:#f0efe8; --muted:#777;
  --accent:#EF9F27; --accent-text:#000;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
html, body { height:100%; background:var(--bg); overscroll-behavior:none; }
body { color:var(--text); font-family:'Syne',sans-serif; padding-top:var(--safe-top);
  -webkit-user-select:none; user-select:none; touch-action:manipulation; }

.wrap { max-width:480px; margin:0 auto; padding:calc(28px + var(--safe-top)) 20px calc(24px + var(--safe-bot)); }
.hero { text-align:center; margin-bottom:26px; }
.hero-title { font-size:26px; font-weight:800; letter-spacing:-.01em; }
.hero-sub { font-size:12.5px; color:var(--muted); margin-top:6px; }

.mode-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.mode-card { grid-column:span 1; width:100%; background:var(--surface); border:1.5px solid var(--border);
  border-radius:18px; padding:20px 12px; text-align:center; cursor:pointer; color:var(--text);
  text-decoration:none; display:block; font-family:'Syne',sans-serif;
  -webkit-tap-highlight-color:transparent; transition:border-color .15s; }
.mode-card:active { border-color:var(--accent); }
.mode-card.wide { grid-column:span 2; display:flex; align-items:center; justify-content:center; gap:12px;
  padding:16px 12px; }
.mode-icon { font-size:28px; display:block; margin-bottom:8px; }
.mode-card.wide .mode-icon { margin-bottom:0; font-size:24px; }
.mode-name { font-weight:800; font-size:14.5px; display:block; }
.mode-sub { font-size:10px; color:var(--muted); margin-top:3px; display:block; }
.mode-card.wide .mode-name { font-size:14px; }
.mode-card.accent { background:var(--surface2); border-color:var(--accent); }
.mode-card.accent .mode-sub { color:#c98a2e; }

.section-label { font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em;
  margin:22px 0 10px; }

.flame { cursor:pointer; display:inline-block; -webkit-tap-highlight-color:transparent; }
.egg-overlay { position:fixed; inset:0; background:#0d0d0f; display:flex; align-items:center; justify-content:center;
  z-index:300; opacity:0; pointer-events:none; transition:opacity .3s; padding:30px; text-align:center; }
.egg-overlay.show { opacity:1; pointer-events:all; }
.egg-big { font-size:32px; font-weight:800; color:var(--accent); line-height:1.4; }
.egg-small { font-size:15px; color:var(--muted); margin-top:10px; line-height:1.5; }
.rainbow-zone { position:fixed; top:0; height:16px; width:16.6667vw; z-index:400; }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="hero-title"><span class="flame" id="flame">🔥</span> Quemagrasa</div>
    <div class="hero-sub">Elige cómo quieres entrenar hoy</div>
  </div>

  <div class="mode-grid">
    <a class="mode-card" href="entrenamientos.html">
      <span class="mode-icon">🏠</span>
      <span class="mode-name">Casa</span>
      <span class="mode-sub">Plan de 30 días</span>
    </a>
    <a class="mode-card" href="cardio.html?m=eliptica">
      <span class="mode-icon">🌀</span>
      <span class="mode-name">Elíptica</span>
      <span class="mode-sub">Timer HIIT</span>
    </a>
    <a class="mode-card" href="cardio.html?m=caminadora">
      <span class="mode-icon">🏃</span>
      <span class="mode-name">Caminadora</span>
      <span class="mode-sub">Timer HIIT</span>
    </a>
    <a class="mode-card" href="cardio.html?m=escaladora">
      <span class="mode-icon">🪜</span>
      <span class="mode-name">Escaladora</span>
      <span class="mode-sub">Timer HIIT</span>
    </a>
  </div>

  <div class="section-label">O si tienes poco tiempo</div>
  <div class="mode-grid">
    <a class="mode-card wide accent" href="rapido.html">
      <span class="mode-icon">⚡</span>
      <span>
        <span class="mode-name">Ejercicio rápido</span>
        <span class="mode-sub">10 min · 8 ejercicios al azar</span>
      </span>
    </a>
  </div>
</div>

<div class="egg-overlay" id="egg-overlay">
  <div>
    <div class="egg-big" id="egg-big"></div>
    <div class="egg-small" id="egg-small"></div>
  </div>
</div>

<div class="rainbow-zone" data-z="0" style="left:0"></div>
<div class="rainbow-zone" data-z="1" style="left:16.6667vw"></div>
<div class="rainbow-zone" data-z="2" style="left:33.3333vw"></div>
<div class="rainbow-zone" data-z="3" style="left:50vw"></div>
<div class="rainbow-zone" data-z="4" style="left:66.6667vw"></div>
<div class="rainbow-zone" data-z="5" style="left:83.3333vw"></div>

<script>
/* easter egg: 7 taps al 🔥 en menos de 3s */
let flameTaps = 0, flameTimer = null;
document.getElementById('flame').addEventListener('click', ()=>{
  flameTaps++;
  clearTimeout(flameTimer);
  flameTimer = setTimeout(()=>{ flameTaps = 0; }, 3000);
  if(flameTaps>=7){
    flameTaps = 0;
    clearTimeout(flameTimer);
    const el = document.getElementById('egg-overlay');
    document.getElementById('egg-big').textContent = '🔥 MODO BESTIA ACTIVADO';
    document.getElementById('egg-small').textContent = '';
    el.classList.add('show');
    setTimeout(()=>{
      document.getElementById('egg-small').textContent = 'Ya deja de tocar la pantalla y ve a entrenar 😤';
    }, 1200);
    setTimeout(()=>{ el.classList.remove('show'); }, 3800);
  }
});

/* easter egg oculto: tocar las 6 zonas invisibles en orden (izquierda a derecha) alterna "modo arcoíris" */
const KEY_RAINBOW = 'qg_rainbow';
let rainbowExpected = 0, rainbowResetTimer = null, rainbowInterval = null, rainbowHue = 0;

function applyRainbowHue(){
  document.documentElement.style.setProperty('--accent', `hsl(${rainbowHue}, 85%, 55%)`);
  rainbowHue = (rainbowHue + 6) % 360;
}
function startRainbow(){
  clearInterval(rainbowInterval);
  applyRainbowHue();
  rainbowInterval = setInterval(applyRainbowHue, 150);
}
function stopRainbow(){
  clearInterval(rainbowInterval);
  rainbowInterval = null;
  document.documentElement.style.removeProperty('--accent');
}
function toggleRainbow(){
  if(rainbowInterval){ stopRainbow(); try{ localStorage.removeItem(KEY_RAINBOW); }catch(e){} }
  else{ startRainbow(); try{ localStorage.setItem(KEY_RAINBOW,'1'); }catch(e){} }
}

document.querySelectorAll('.rainbow-zone').forEach(zone=>{
  zone.addEventListener('click', ()=>{
    const z = parseInt(zone.dataset.z, 10);
    clearTimeout(rainbowResetTimer);
    if(z === rainbowExpected){
      rainbowExpected++;
      if(rainbowExpected >= 6){
        rainbowExpected = 0;
        toggleRainbow();
        return;
      }
      rainbowResetTimer = setTimeout(()=>{ rainbowExpected = 0; }, 4000);
    } else {
      rainbowExpected = (z===0) ? 1 : 0;
      if(rainbowExpected) rainbowResetTimer = setTimeout(()=>{ rainbowExpected = 0; }, 4000);
    }
  });
});

try{ if(localStorage.getItem(KEY_RAINBOW)==='1') startRainbow(); }catch(e){}
</script>
</body>
</html>

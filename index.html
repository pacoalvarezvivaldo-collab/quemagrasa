<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SPORTIUUM">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d0d0f">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self' 'unsafe-inline' https://esm.sh; img-src 'self' data:; media-src 'self' data:; connect-src https://*.supabase.co; frame-ancestors 'none'; base-uri 'none'; form-action 'none';">
<title>SPORTIUUM</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
:root {
  --bg:#0d0d0f; --surface:#18181c; --surface2:#222228;
  --border:rgba(255,255,255,0.08); --text:#f0efe8; --muted:#777;
  --accent:#EF9F27; --accent-text:#000;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
html, body { height:100%; background:var(--bg); overscroll-behavior:none; }
body { color:var(--text); font-family:'Syne',sans-serif; padding-top:var(--safe-top);
  -webkit-user-select:none; user-select:none; touch-action:manipulation; }

.wrap { max-width:480px; margin:0 auto; padding:calc(28px + var(--safe-top)) 20px calc(24px + var(--safe-bot)); }
.hero-mark { width:40px; height:40px; border-radius:12px; background:var(--accent); position:relative;
  margin:0 auto 10px; overflow:hidden; }
.hero-mark i { position:absolute; left:8px; width:24px; height:6px; background:var(--accent-text); transform:skewX(-24deg); }
.hero-mark i:nth-child(1) { top:9px; }
.hero-mark i:nth-child(2) { top:17px; width:8px; }
.hero-mark i:nth-child(3) { top:17px; left:24px; width:8px; }
.hero-mark i:nth-child(4) { top:25px; }
.hero { text-align:center; margin-bottom:26px; }
.hero-title { font-size:26px; font-weight:800; letter-spacing:-.01em; }
.hero-sub { font-size:12.5px; color:var(--muted); margin-top:6px; }
.hero-streak { display:none; font-size:12.5px; color:var(--accent); font-weight:700; margin-top:8px; }

.mode-list { display:flex; flex-direction:column; gap:8px; }
.mode-row { display:flex; align-items:center; gap:14px; width:100%; background:var(--surface);
  border:1.5px solid var(--border); border-radius:14px; padding:14px 16px; text-align:left;
  cursor:pointer; color:var(--text); text-decoration:none; font-family:'Syne',sans-serif;
  -webkit-tap-highlight-color:transparent; transition:border-color .15s; }
.mode-row:active { border-color:var(--accent); }
.mode-row .mode-icon { font-size:23px; flex-shrink:0; width:30px; text-align:center; }
.mode-row .mode-text { flex:1; min-width:0; }
.mode-row .mode-name { font-weight:800; font-size:15px; display:block; }
.mode-row .mode-sub { font-size:11px; color:var(--muted); margin-top:2px; display:block; }
.mode-row .mode-chevron { color:var(--muted); font-size:15px; flex-shrink:0; }
.mode-row.accent { border-color:var(--accent); background:var(--surface2); }
.mode-row.accent .mode-sub { color:var(--accent); }
.section-label { font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--muted); margin:10px 2px 0; }

.quick-cta { flex-direction:column; justify-content:center; text-align:center;
  padding:48px 20px; border-width:2px; gap:10px; border-radius:26px; margin-top:6px; }
.quick-cta-icon { font-size:48px; }
.quick-cta-title { font-weight:800; font-size:23px; }
.quick-cta-sub { font-size:13px; color:var(--accent); font-weight:700; }

.flame { cursor:pointer; display:inline-block; -webkit-tap-highlight-color:transparent; }
.egg-overlay { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center;
  z-index:300; opacity:0; pointer-events:none; transition:opacity .3s; padding:30px; text-align:center; }
.egg-overlay.show { opacity:1; pointer-events:all; }
.egg-big { font-size:32px; font-weight:800; color:var(--accent); line-height:1.4; }
.egg-small { font-size:15px; color:var(--muted); margin-top:10px; line-height:1.5; }

.mode-row.fallen { position:fixed; cursor:grab; z-index:500; touch-action:none;
  transition:top .7s cubic-bezier(.34,1.4,.64,1), left .7s cubic-bezier(.34,1.4,.64,1), transform .7s cubic-bezier(.34,1.4,.64,1); }
.mode-row.fallen.dragging { cursor:grabbing; transition:none; }

.tap-ripple { position:fixed; width:14px; height:14px; border-radius:50%; background:var(--accent);
  opacity:.45; transform:translate(-50%,-50%) scale(0); pointer-events:none; z-index:250;
  animation:tap-ripple-anim .55s ease-out forwards; }
@keyframes tap-ripple-anim { to { transform:translate(-50%,-50%) scale(16); opacity:0; } }

/* ---- onboarding: pedir peso/estatura una sola vez al abrir la app (los datos
   se ven y editan en Progreso — aquí solo se piden una vez al inicio) ---- */
.field-label { font-size:12.5px; font-weight:700; display:block; margin-bottom:6px; }
.field-input { background:var(--surface2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:9px 10px; font-family:'Space Mono',monospace; font-size:14px;
  width:100%; -webkit-appearance:none; margin-bottom:12px; }
.progress-btn { width:100%; background:var(--accent); color:var(--accent-text); border:none;
  border-radius:12px; padding:12px; font-weight:700; font-family:'Syne',sans-serif; font-size:13px;
  cursor:pointer; -webkit-tap-highlight-color:transparent; }
.progress-btn-secondary { width:100%; background:var(--surface2); color:var(--text); border:1px solid var(--border);
  border-radius:12px; padding:12px; font-weight:700; font-family:'Syne',sans-serif; font-size:13px;
  cursor:pointer; -webkit-tap-highlight-color:transparent; margin-top:8px; }
.onboard-overlay { position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; align-items:center;
  justify-content:center; z-index:600; opacity:0; pointer-events:none; transition:opacity .2s; padding:20px; }
.onboard-overlay.show { opacity:1; pointer-events:all; }
.onboard-box { background:var(--surface); border:1.5px solid var(--border); border-radius:16px;
  padding:20px; max-width:340px; width:100%; }
.onboard-title { font-size:17px; font-weight:800; margin-bottom:6px; }
.onboard-sub { font-size:12.5px; color:var(--muted); margin-bottom:16px; line-height:1.4; }
</style>
</head>
<body>

<div class="wrap">
  <div class="hero">
    <div class="hero-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="hero-title"><span class="flame" id="flame">🔥</span> SPORTIUUM</div>
    <div class="hero-sub">Elige cómo quieres entrenar hoy</div>
    <div class="hero-streak" id="hero-streak"></div>
  </div>

  <a class="mode-row accent quick-cta" href="rapido.html">
    <span class="quick-cta-icon">⚡</span>
    <span class="quick-cta-title">Ejercicio rápido</span>
    <span class="quick-cta-sub">10 min · 8 ejercicios al azar</span>
  </a>
</div>

<div class="onboard-overlay" id="onboard-overlay">
  <div class="onboard-box">
    <div class="onboard-title">📊 Antes de empezar</div>
    <div class="onboard-sub">Registra tu peso y estatura para ver tu progreso e IMC. Si no los tienes a la mano, puedes hacerlo después.</div>
    <label class="field-label">Peso (kg)</label>
    <input class="field-input" id="onboard-weight" type="number" inputmode="decimal" min="30" max="300" step="0.1" placeholder="70.0">
    <label class="field-label">Estatura (cm)</label>
    <input class="field-input" id="onboard-height" type="number" inputmode="numeric" min="100" max="250" placeholder="170">
    <button class="progress-btn" onclick="saveOnboardEntry()">Guardar</button>
    <button class="progress-btn-secondary" onclick="skipOnboarding()">Tal vez después</button>
  </div>
</div>

<div class="egg-overlay" id="egg-overlay">
  <div>
    <div class="egg-big" id="egg-big"></div>
    <div class="egg-small" id="egg-small"></div>
  </div>
</div>

<script src="sync.js"></script>
<script src="weight-log.js"></script>
<script src="streak.js"></script>
<script src="prefs.js"></script>
<script src="nav.js"></script>
<script>
/* ---------- onboarding: pedir peso/estatura una sola vez al abrir la app.
   Los datos se guardan aquí pero se ven/editan en Progreso — ese widget se
   movió ahí porque no tenía sentido en Inicio, justo junto a las demás
   estadísticas. ---------- */
const KEY_ONBOARD_SEEN = 'qg_onboard_seen';
function closeOnboarding(){
  try{ localStorage.setItem(KEY_ONBOARD_SEEN, '1'); }catch(e){}
  document.getElementById('onboard-overlay').classList.remove('show');
}
function skipOnboarding(){ closeOnboarding(); }
function saveOnboardEntry(){
  const w = parseFloat(document.getElementById('onboard-weight').value);
  const h = parseFloat(document.getElementById('onboard-height').value);
  if(isNaN(w) || w<30 || w>300 || isNaN(h) || h<100 || h>250){
    alert('Ingresa un peso (30-300 kg) y estatura (100-250 cm) válidos.');
    return;
  }
  WeightLog.saveTodayWeight(w);
  WeightLog.saveHeightCm(h);
  if(window.QuemaSync){
    QuemaSync.pushWeightEntry({ date: WeightLog.todayStr(), weightKg: w });
    QuemaSync.pushUserState({ height_cm: h });
  }
  closeOnboarding();
}
function maybeShowOnboarding(){
  try{
    if(localStorage.getItem(KEY_ONBOARD_SEEN)) return;
    if(WeightLog.getLog().length){ localStorage.setItem(KEY_ONBOARD_SEEN, '1'); return; } // ya tenía datos de antes de este onboarding
  }catch(e){ return; }
  document.getElementById('onboard-overlay').classList.add('show');
}
try{ maybeShowOnboarding(); }catch(e){}

function renderStreak(){
  const el = document.getElementById('hero-streak');
  if(!window.Streak){ el.style.display = 'none'; return; }
  const n = Streak.getCurrentStreak();
  if(n > 0){
    el.textContent = `🔥 ${n} día${n===1?'':'s'} seguido${n===1?'':'s'}`;
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}
try{ renderStreak(); }catch(e){}

/* al cargar, si ya hay sesión de sync activa (iniciada desde Casa o Correr), trae la
   racha del servidor y la fusiona con la local — sin sesión, esto no hace ninguna
   llamada de red. El peso/estatura/meta ahora se sincronizan desde Progreso, que es
   donde se muestran y editan. */
async function syncPullOnLoad(){
  if(!window.QuemaSync) return;
  await QuemaSync.initSilent(); // sin botón propio: hereda la sesión ya persistida por Supabase, si existe
  if(!QuemaSync.isSignedIn()) return;
  const remote = await QuemaSync.pullUserState();
  if(remote && remote.activityLog && remote.activityLog.length) Streak.mergeRemoteLog(remote.activityLog);
  await QuemaSync.pushUserState({ activity_log: Streak.getLog() });
  renderStreak();
}
if(window.QuemaSync) syncPullOnLoad().catch(()=>{});

/* easter egg: 7 taps al 🔥 en menos de 3s */
let flameTaps = 0, flameTimer = null;
document.getElementById('flame').addEventListener('click', ()=>{
  flameTaps++;
  clearTimeout(flameTimer);
  flameTimer = setTimeout(()=>{ flameTaps = 0; }, 3000);
  if(flameTaps>=7){
    flameTaps = 0;
    clearTimeout(flameTimer);
    const el = document.getElementById('egg-overlay');
    document.getElementById('egg-big').textContent = '🔥 MODO BESTIA ACTIVADO';
    document.getElementById('egg-small').textContent = '';
    el.classList.add('show');
    setTimeout(()=>{
      document.getElementById('egg-small').textContent = 'Ya deja de tocar la pantalla y ve a entrenar 😤';
    }, 1200);
    setTimeout(()=>{ el.classList.remove('show'); }, 3800);
  }
});

/* aplica el tema elegido y el ciclo de color si el modo arcoíris ya está activo. */
try{ Prefs.applyThemeIfSet(); }catch(e){}
try{ Prefs.applyRainbowIfOn(); }catch(e){}
Nav.render('inicio');

document.addEventListener('click', ()=>{ try{ Prefs.maybeRequestFullscreen(); }catch(e){} }, {once:true});

/* toque en zona vacía (fuera de botones/links): ripple ambient, sin acción */
document.addEventListener('click', e=>{
  if(e.target.closest('a, button, input')) return;
  const r = document.createElement('div');
  r.className = 'tap-ripple';
  r.style.left = e.clientX + 'px';
  r.style.top = e.clientY + 'px';
  document.body.appendChild(r);
  r.addEventListener('animationend', ()=>r.remove());
  registerEmptyTap();
});

window.addEventListener('pageshow', e=>{ if(e.persisted){ try{ renderStreak(); }catch(err){} } });

/* easter egg oculto: 60 taps seguidos en zona vacía → los botones "caen" y se pueden arrastrar */
let emptyTapCount = 0, emptyTapResetTimer = null;
const EMPTY_TAP_GOAL = 60;

function registerEmptyTap(){
  emptyTapCount++;
  clearTimeout(emptyTapResetTimer);
  emptyTapResetTimer = setTimeout(()=>{ emptyTapCount = 0; }, 2000);
  if(emptyTapCount >= EMPTY_TAP_GOAL){
    emptyTapCount = 0;
    clearTimeout(emptyTapResetTimer);
    dropButtons();
  }
}

function dropButtons(){
  document.querySelectorAll('.mode-row').forEach(row=>{
    if(row.classList.contains('fallen')) return;
    const r = row.getBoundingClientRect();
    row.style.position = 'fixed';
    row.style.left = r.left+'px';
    row.style.top = r.top+'px';
    row.style.width = r.width+'px';
    row.style.height = r.height+'px';
    row.style.margin = '0';
    row.classList.add('fallen');
    requestAnimationFrame(()=>{
      const maxLeft = Math.max(10, window.innerWidth - r.width - 10);
      const maxTop = Math.max(10, window.innerHeight - r.height - 10);
      row.style.left = (10 + Math.random()*(maxLeft-10)) + 'px';
      row.style.top = (10 + Math.random()*(maxTop-10)) + 'px';
      row.style.transform = `rotate(${(Math.random()*50-25).toFixed(1)}deg)`;
    });
    makeDraggable(row);
  });
}

function makeDraggable(row){
  let dragging = false, moved = false, startX = 0, startY = 0, startLeft = 0, startTop = 0;
  row.addEventListener('pointerdown', e=>{
    dragging = true; moved = false;
    row.setPointerCapture(e.pointerId);
    row.classList.add('dragging');
    startX = e.clientX; startY = e.clientY;
    startLeft = parseFloat(row.style.left)||0;
    startTop = parseFloat(row.style.top)||0;
  });
  row.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if(Math.abs(dx)>4 || Math.abs(dy)>4) moved = true;
    row.style.left = (startLeft+dx)+'px';
    row.style.top = (startTop+dy)+'px';
  });
  row.addEventListener('pointerup', ()=>{
    dragging = false;
    row.classList.remove('dragging');
    if(moved) row.dataset.justDragged = '1';
  });
}

document.addEventListener('click', e=>{
  const fallen = e.target.closest('.fallen');
  if(fallen && fallen.dataset.justDragged){
    delete fallen.dataset.justDragged;
    e.preventDefault();
    e.stopImmediatePropagation();
  }
}, true);
</script>
</body>
</html>
